<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labpaint - Landpage</title>

    <!-- Folhas de estilo -->
     <link rel="stylesheet" href="/estilos/estilo-global.css">
     <link rel="stylesheet" href="/estilos/landpage.css">

</head>
<body>
    <!-- Container que segura as seções -->
    <div id="container">

        <!-- == Seção1  header + nav-bar + hero-section (primeira seção visível do site) == -->
        <section class="cor-fundo-escura section-pagina">
            <!--1. Cabeçalho -->
            <header>header (cabeçalho)</header>
            <!--2. Barra de navegação -->
            <nav>nav-bar (Barra de navegação)</nav>
            <!--3. Seção Hero com imagem de amostra -->
            <div id="section-hero" class="hero-centralizado">
                <div id="text-hero">seção hero (conteúdo principal do hero-section)</div>
                <div id="image-hero">imagem (ilustração do hero)</div>
            </div>
        </section>

        <!-- == Seção2 main-content == -->
        <section class="cor-fundo-clara section-pagina">
            <div class="conteudo-centralizado">main-content (Conteúdo principal)</div>
        </section>

        <!-- == Seção3 main-content + footer == -->
        <section class="cor-fundo-escura section-pagina">
            <div class="conteudo-centralizado">main-content (Conteúdo principal com footer)</div>
            <footer>footer (Rodapé do site contendo as informações)</footer>
        </section>
        
    </div>
</body>
</html>
